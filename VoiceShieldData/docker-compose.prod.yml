version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: voiceshield-db
    environment:
      POSTGRES_USER: voiceshield
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-production}
      POSTGRES_DB: voiceshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceshield"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceshield-net

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: voiceshield-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceshield-net
    profiles:
      - with-redis

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voiceshield-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://voiceshield:${DB_PASSWORD:-change-me-in-production}@postgres:5432/voiceshield
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - voiceshield-net
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
    container_name: voiceshield-web
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - voiceshield-net
    restart: unless-stopped

  # ML Service (optional - external or internal)
  # Uncomment if running ML service in Docker
  # ml-service:
  #   image: voiceshield-ml:latest
  #   container_name: voiceshield-ml
  #   ports:
  #     - "8000:8000"
  #   networks:
  #     - voiceshield-net
  #   restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  voiceshield-net:
    driver: bridge
