version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: voiceshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voiceshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds/seed_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voiceshield"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: voiceshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI PyTorch ML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: ../docker/Dockerfile.ml
    container_name: voiceshield-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./artifacts:/app/artifacts:ro
    environment:
      - MODEL_PATH=/app/models/voiceshield_best/model.pt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. Node.js API Gateway & Queue Worker
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: voiceshield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/voiceshield
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=production-voiceshield-secure-secret-key-2026
      - JWT_REFRESH_SECRET=production-voiceshield-refresh-secret-key-2026
      - CORS_ORIGIN=*
    volumes:
      - uploads_data:/app/uploads

  # 5. React Three.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: voiceshield-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  uploads_data:
